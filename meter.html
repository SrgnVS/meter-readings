<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Счётчик</title>
    <!-- Подключаем библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .app { max-width: 480px; width: 100%; background: white; border-radius: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 24px 20px; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 16px; }
        .step { display: none; flex-direction: column; gap: 16px; }
        .step.active { display: flex; }
        .btn { background: #2563eb; color: white; border: none; padding: 14px 20px; border-radius: 16px; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.2s; width: 100%; text-align: center; }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: #e5e7eb; color: #1f2937; }
        .btn-danger { background: #dc2626; }
        .btn-success { background: #16a34a; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .video-container, .canvas-container { background: #1e293b; border-radius: 20px; overflow: hidden; position: relative; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
        #canvas-preview { object-fit: contain; background: #0f172a; }
        .overlay-text { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 6px 16px; border-radius: 40px; font-size: 14px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-weight: 500; font-size: 14px; color: #374151; }
        .input-group input { padding: 12px 16px; border: 2px solid #d1d5db; border-radius: 12px; font-size: 18px; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: #2563eb; }
        .status-box { padding: 12px 16px; border-radius: 12px; background: #f1f5f9; font-size: 14px; color: #1e293b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .status-box.success { background: #dcfce7; color: #166534; }
        .status-box.error { background: #fee2e2; color: #991b1b; }
        .row { display: flex; gap: 10px; }
        .row .btn { flex: 1; }
        .history-item { padding: 12px; background: #f8fafc; border-radius: 12px; border-left: 4px solid #2563eb; font-size: 14px; display: flex; justify-content: space-between; margin-bottom: 8px; }
        .hidden { display: none; }
        #pending-count { text-align:center; font-size:14px; color:#64748b; margin-top:8px; }
        #qr-result { font-size:14px; text-align:center; min-height: 24px; }
    </style>
</head>
<body>
<div class="app">
    <h1>📟 Передача показаний</h1>

    <!-- ШАГ 1: СТАРТ -->
    <div id="step-start" class="step active">
        <button class="btn" id="btn-scan-qr">📷 Сканировать QR-код счётчика</button>
        <button class="btn btn-secondary" id="btn-manual">✏️ Ввести показания вручную</button>
        <button class="btn btn-secondary" id="btn-history">📋 История отправок</button>
        <div id="pending-count"></div>
    </div>

    <!-- ШАГ 2: СКАНИРОВАНИЕ QR -->
    <div id="step-qr" class="step">
        <div class="video-container">
            <video id="qr-video" autoplay playsinline></video>
            <div class="overlay-text">Наведите на QR-код</div>
        </div>
        <button class="btn btn-secondary" id="btn-qr-cancel">Отмена</button>
        <div id="qr-result">⏳ Подготовка...</div>
    </div>

    <!-- ШАГ 3: РУЧНОЙ ВВОД НОМЕРА СЧЁТЧИКА -->
    <div id="step-manual-id" class="step">
        <div class="input-group">
            <label>Введите номер счётчика (или идентификатор):</label>
            <input type="text" id="input-meter-id" placeholder="Например: METER-001">
        </div>
        <button class="btn" id="btn-manual-id-next">📸 Далее → сфотографировать показания</button>
        <button class="btn btn-secondary" id="btn-manual-id-cancel">Отмена</button>
    </div>

    <!-- ШАГ 4: ФОТОГРАФИЯ -->
    <div id="step-photo" class="step">
        <div class="video-container">
            <video id="photo-video" autoplay playsinline></video>
            <div class="overlay-text">Наведите и нажмите «Сделать фото»</div>
        </div>
        <div class="row">
            <button class="btn" id="btn-take-photo">📸 Сделать фото</button>
            <button class="btn btn-secondary" id="btn-photo-cancel">Отмена</button>
        </div>
        <canvas id="photo-canvas" class="hidden"></canvas>
    </div>

    <!-- ШАГ 5: РАСПОЗНАВАНИЕ + РУЧНОЙ ВВОД ПОКАЗАНИЙ -->
    <div id="step-recognize" class="step">
        <div class="canvas-container">
            <canvas id="canvas-preview"></canvas>
        </div>
        <div class="status-box" id="ocr-status">⏳ Распознаём показания...</div>
        <div class="input-group">
            <label>Показания (цифры):</label>
            <input type="text" id="input-meter" inputmode="numeric" pattern="[0-9]*" placeholder="Например: 12345">
        </div>
        <div class="row">
            <button class="btn btn-success" id="btn-submit">✅ Отправить</button>
            <button class="btn btn-secondary" id="btn-retry-photo">📸 Переснять</button>
        </div>
        <div id="submit-status" style="font-size:14px; text-align:center; margin-top:8px;"></div>
    </div>

    <!-- ШАГ 6: ИСТОРИЯ -->
    <div id="step-history" class="step">
        <div id="history-list"></div>
        <button class="btn btn-secondary" id="btn-history-back">Назад</button>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // Проверяем загрузку jsQR
        if (typeof jsQR === 'undefined') {
            alert('Ошибка: библиотека jsQR не загружена! Проверьте доступ к cdn.jsdelivr.net');
        } else {
            console.log('jsQR загружена');
        }

        const SERVER_URL = 'https://meter-readings.relaxdev.ru/upload';
        let currentMeterData = { qr: '', photoBlob: null, photoDataURL: '', recognizedText: '', manualInput: '' };
        let qrScannerActive = false;
        let photoCameraActive = false;
        let stream = null;
        let photoCanvas = document.getElementById('photo-canvas');
        let previewCanvas = document.getElementById('canvas-preview');
        let ctxPreview = previewCanvas.getContext('2d');

        // Очередь
        function getQueue() {
            try { return JSON.parse(localStorage.getItem('meterQueue')) || []; } catch { return []; }
        }
        function setQueue(queue) {
            localStorage.setItem('meterQueue', JSON.stringify(queue));
            updatePendingCount();
        }
        function addToQueue(item) {
            const q = getQueue();
            q.push(item);
            setQueue(q);
        }
        function updatePendingCount() {
            const q = getQueue();
            document.getElementById('pending-count').textContent = q.length ? `⏳ Ожидает отправки: ${q.length} записей` : '';
        }
        updatePendingCount();

        function showStep(id) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function startCamera(videoElement, facingMode = 'environment') {
            try {
                if (stream) { stream.getTracks().forEach(t => t.stop()); }
                const constraints = { video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                await videoElement.play();
                return true;
            } catch (e) {
                alert('Не удалось получить доступ к камере. Разрешите доступ в настройках браузера.');
                return false;
            }
        }

        function stopCamera() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            document.querySelectorAll('video').forEach(v => { v.srcObject = null; v.pause(); });
        }

        // ----- QR-сканер с улучшенной отладкой -----
        let qrScanInterval = null;

        function scanQR(video) {
            if (qrScanInterval) clearInterval(qrScanInterval);
            document.getElementById('qr-result').textContent = '⏳ Сканирование запущено...';
            qrScanInterval = setInterval(() => {
                if (!qrScannerActive) {
                    document.getElementById('qr-result').textContent = '⏳ Сканирование остановлено';
                    return;
                }
                if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                    document.getElementById('qr-result').textContent = '⏳ Ожидание видео...';
                    return;
                }
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                if (!imageData.data || imageData.data.length === 0) {
                    document.getElementById('qr-result').textContent = '⚠️ Нет данных с камеры';
                    return;
                }
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "attemptBoth"
                });
                if (code && code.data) {
                    qrScannerActive = false;
                    clearInterval(qrScanInterval);
                    document.getElementById('qr-result').textContent = '✅ QR найден: ' + code.data;
                    currentMeterData.qr = code.data;
                    stopCamera();
                    showStep('step-photo');
                    startPhotoCamera();
                } else {
                    // Редкое обновление статуса, чтобы не мигать
                    if (Math.random() < 0.03) {
                        document.getElementById('qr-result').textContent = '🔍 Сканирую...';
                    }
                }
            }, 250);
        }

        // ----- Обработчики -----
        document.getElementById('btn-scan-qr').addEventListener('click', async () => {
            showStep('step-qr');
            const video = document.getElementById('qr-video');
            document.getElementById('qr-result').textContent = '⏳ Запрос доступа к камере...';
            const ok = await startCamera(video, 'environment');
            if (ok) {
                qrScannerActive = true;
                document.getElementById('qr-result').textContent = '✅ Камера запущена, сканируем...';
                scanQR(video);
            } else {
                document.getElementById('qr-result').textContent = '❌ Ошибка доступа к камере';
                showStep('step-start');
            }
        });

        document.getElementById('btn-qr-cancel').addEventListener('click', () => {
            qrScannerActive = false;
            if (qrScanInterval) clearInterval(qrScanInterval);
            stopCamera();
            document.getElementById('qr-result').textContent = '⏳ Отменено';
            showStep('step-start');
        });

        // Ручной ввод номера счётчика
        document.getElementById('btn-manual').addEventListener('click', () => {
            showStep('step-manual-id');
            document.getElementById('input-meter-id').value = '';
        });

        document.getElementById('btn-manual-id-next').addEventListener('click', () => {
            const id = document.getElementById('input-meter-id').value.trim();
            if (!id) {
                alert('Введите номер счётчика');
                return;
            }
            currentMeterData.qr = id;
            currentMeterData.photoBlob = null;
            currentMeterData.photoDataURL = '';
            showStep('step-photo');
            startPhotoCamera();
        });

        document.getElementById('btn-manual-id-cancel').addEventListener('click', () => {
            showStep('step-start');
        });

        document.getElementById('btn-history').addEventListener('click', () => {
            renderHistory();
            showStep('step-history');
        });
        document.getElementById('btn-history-back').addEventListener('click', () => showStep('step-start'));

        // ----- Фото -----
        async function startPhotoCamera() {
            const video = document.getElementById('photo-video');
            const ok = await startCamera(video, 'environment');
            if (!ok) showStep('step-start');
        }

        document.getElementById('btn-take-photo').addEventListener('click', () => {
            const video = document.getElementById('photo-video');
            if (!video.videoWidth || !video.videoHeight) { alert('Камера не готова'); return; }
            photoCanvas.width = video.videoWidth;
            photoCanvas.height = video.videoHeight;
            const ctx = photoCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
            photoCanvas.toBlob((blob) => {
                currentMeterData.photoBlob = blob;
                currentMeterData.photoDataURL = photoCanvas.toDataURL('image/jpeg', 0.92);
                previewCanvas.width = photoCanvas.width;
                previewCanvas.height = photoCanvas.height;
                ctxPreview.drawImage(photoCanvas, 0, 0);
                stopCamera();
                showStep('step-recognize');
                recognizeMeter(blob);
            }, 'image/jpeg', 0.92);
        });

        document.getElementById('btn-photo-cancel').addEventListener('click', () => {
            stopCamera();
            showStep('step-start');
        });

        // ----- Распознавание -----
        async function recognizeMeter(blob) {
            const statusEl = document.getElementById('ocr-status');
            statusEl.textContent = '⏳ Распознаём цифры...';
            statusEl.className = 'status-box';
            document.getElementById('input-meter').value = '';
            document.getElementById('submit-status').textContent = '';
            document.getElementById('btn-submit').disabled = true;
            try {
                const result = await Tesseract.recognize(blob, 'eng', {
                    tessedit_char_whitelist: '0123456789',
                    tessedit_pageseg_mode: 6
                });
                const text = result.data.text.replace(/[^0-9]/g, '').trim();
                currentMeterData.recognizedText = text;
                if (text.length > 0) {
                    document.getElementById('input-meter').value = text;
                    statusEl.textContent = '✅ Распознано: ' + text;
                    statusEl.className = 'status-box success';
                } else {
                    statusEl.textContent = '⚠️ Не удалось распознать цифры. Введите вручную.';
                    statusEl.className = 'status-box error';
                }
            } catch (e) {
                statusEl.textContent = '❌ Ошибка распознавания. Введите вручную.';
                statusEl.className = 'status-box error';
            }
            document.getElementById('btn-submit').disabled = false;
        }

        document.getElementById('input-meter').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9,.]/g, ''); // разрешаем запятую и точку
            currentMeterData.manualInput = this.value;
        });

        document.getElementById('btn-retry-photo').addEventListener('click', () => {
            showStep('step-photo');
            startPhotoCamera();
        });

        // ----- Отправка -----
        document.getElementById('btn-submit').addEventListener('click', async () => {
            const input = document.getElementById('input-meter');
            const value = input.value.trim();
            if (!value) { document.getElementById('submit-status').textContent = '❌ Введите показания!'; return; }
            const submitStatus = document.getElementById('submit-status');
            submitStatus.textContent = '⏳ Отправка...';
            document.getElementById('btn-submit').disabled = true;

            const formData = new FormData();
            formData.append('qr', currentMeterData.qr || '');
            formData.append('meter_reading', value);
            if (currentMeterData.photoBlob) {
                formData.append('photo', currentMeterData.photoBlob, 'meter.jpg');
            }
            formData.append('timestamp', new Date().toISOString());

            try {
                const response = await fetch(SERVER_URL, { method: 'POST', body: formData });
                if (response.ok) {
                    submitStatus.textContent = '✅ Отправлено успешно!';
                    submitStatus.className = 'status-box success';
                    currentMeterData.photoBlob = null;
                    currentMeterData.photoDataURL = '';
                    setTimeout(() => { showStep('step-start'); document.getElementById('btn-submit').disabled = false; submitStatus.textContent = ''; }, 2000);
                } else {
                    throw new Error('Сервер вернул ' + response.status);
                }
            } catch (e) {
                console.warn('Ошибка отправки, сохраняем в очередь:', e);
                addToQueue({
                    qr: currentMeterData.qr || '',
                    meter_reading: value,
                    photoDataURL: currentMeterData.photoDataURL,
                    timestamp: new Date().toISOString()
                });
                submitStatus.textContent = '⚠️ Сервер недоступен. Данные сохранены в очередь.';
                submitStatus.className = 'status-box error';
                document.getElementById('btn-submit').disabled = false;
                setTimeout(() => { showStep('step-start'); document.getElementById('btn-submit').disabled = false; submitStatus.textContent = ''; }, 3000);
            }
        });

        // ----- История -----
        function renderHistory() {
            const list = document.getElementById('history-list');
            const queue = getQueue();
            if (!queue.length) { list.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px;">Нет данных в очереди</div>'; return; }
            let html = '';
            queue.forEach((item, idx) => {
                html += `<div class="history-item">
                    <div><strong>${item.meter_reading}</strong> кВт·ч<br><span style="font-size:12px; color:#64748b;">QR: ${item.qr || '—'}</span><br><span style="font-size:12px; color:#64748b;">${new Date(item.timestamp).toLocaleString()}</span></div>
                    <div>
                        <button class="btn btn-success" style="padding:6px 12px; font-size:12px; width:auto;" data-idx="${idx}">↻ Отправить</button>
                        <button class="btn btn-danger" style="padding:6px 12px; font-size:12px; width:auto; margin-top:4px;" data-idx="${idx}">✕ Удалить</button>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
            list.querySelectorAll('[data-idx]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    const queue = getQueue();
                    if (this.textContent.includes('Отправить')) {
                        sendFromQueue(idx);
                    } else {
                        queue.splice(idx, 1);
                        setQueue(queue);
                        renderHistory();
                    }
                });
            });
        }

        async function sendFromQueue(idx) {
            const queue = getQueue();
            if (idx >= queue.length) return;
            const item = queue[idx];
            const formData = new FormData();
            formData.append('qr', item.qr || '');
            formData.append('meter_reading', item.meter_reading);
            if (item.photoDataURL) {
                const res = await fetch(item.photoDataURL);
                const blob = await res.blob();
                formData.append('photo', blob, 'meter.jpg');
            }
            formData.append('timestamp', item.timestamp || new Date().toISOString());
            try {
                const res = await fetch(SERVER_URL, { method: 'POST', body: formData });
                if (res.ok) {
                    queue.splice(idx, 1);
                    setQueue(queue);
                    renderHistory();
                    alert('✅ Отправлено успешно!');
                } else {
                    alert('❌ Ошибка сервера');
                }
            } catch (e) {
                alert('⚠️ Нет связи с сервером');
            }
        }

        // При загрузке предложить отправить очередь
        window.addEventListener('load', () => {
            const q = getQueue();
            if (q.length > 0) {
                if (confirm(`Есть ${q.length} неотправленных записей. Отправить сейчас?`)) {
                    renderHistory();
                    showStep('step-history');
                }
            }
        });
    })();
</script>
</body>
</html>
