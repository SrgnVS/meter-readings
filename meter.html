<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Счётчик</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        /* ... (стили те же) ... */
    </style>
</head>
<body>
    <!-- ... (HTML такой же) ... -->
    <script>
        (function() {
            'use strict';

            // Проверяем, загрузилась ли jsQR
            if (typeof jsQR === 'undefined') {
                alert('Ошибка: библиотека jsQR не загружена! Проверьте доступ к cdn.jsdelivr.net');
            } else {
                console.log('jsQR загружена');
            }

            const SERVER_URL = 'https://meter-readings.relaxdev.ru/upload';
            let currentMeterData = { qr: '', photoBlob: null, photoDataURL: '', recognizedText: '', manualInput: '' };
            let qrScannerActive = false;
            let photoCameraActive = false;
            let stream = null;
            let photoCanvas = document.getElementById('photo-canvas');
            let previewCanvas = document.getElementById('canvas-preview');
            let ctxPreview = previewCanvas.getContext('2d');

            // ... (все остальные функции) ...

            // В функции scanQR добавим логирование и визуальный статус
            function scanQR(video) {
                if (qrScanInterval) clearInterval(qrScanInterval);
                document.getElementById('qr-result').textContent = '⏳ Сканирование запущено...';
                qrScanInterval = setInterval(() => {
                    if (!qrScannerActive) {
                        document.getElementById('qr-result').textContent = '⏳ Сканирование остановлено';
                        return;
                    }
                    if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                        document.getElementById('qr-result').textContent = '⏳ Ожидание видео...';
                        return;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    // Проверяем, есть ли данные
                    if (!imageData.data || imageData.data.length === 0) {
                        document.getElementById('qr-result').textContent = '⚠️ Нет данных с камеры';
                        return;
                    }
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "attemptBoth"
                    });
                    if (code && code.data) {
                        qrScannerActive = false;
                        clearInterval(qrScanInterval);
                        document.getElementById('qr-result').textContent = '✅ QR найден: ' + code.data;
                        currentMeterData.qr = code.data;
                        stopCamera();
                        showStep('step-photo');
                        startPhotoCamera();
                    } else {
                        // Если код не найден, выводим статус (но не слишком часто)
                        if (Math.random() < 0.05) { // редко, чтобы не мелькало
                            document.getElementById('qr-result').textContent = '🔍 Сканирую...';
                        }
                    }
                }, 300);
            }

            // В обработчике btn-scan-qr добавим проверку
            document.getElementById('btn-scan-qr').addEventListener('click', async () => {
                showStep('step-qr');
                const video = document.getElementById('qr-video');
                document.getElementById('qr-result').textContent = '⏳ Запрос доступа к камере...';
                const ok = await startCamera(video, 'environment');
                if (ok) {
                    qrScannerActive = true;
                    document.getElementById('qr-result').textContent = '✅ Камера запущена, сканируем...';
                    scanQR(video);
                } else {
                    document.getElementById('qr-result').textContent = '❌ Ошибка доступа к камере';
                    showStep('step-start');
                }
            });

            // ... (остальной код без изменений) ...
        })();
    </script>
</body>
</html>
